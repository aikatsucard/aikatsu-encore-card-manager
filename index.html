<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>アイカツ！カード管理</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
    "Yu Gothic", sans-serif;
  background: #fff7fb;
  color: #555;
}

header {
  background: #ffb7d5;
  color: white;
  text-align: center;
  padding: 18px 10px;
  font-size: 22px;
  font-weight: bold;
}

.screen {
  display: none;
  padding: 16px;
  max-width: 700px;
  margin: auto;
}

.screen.active {
  display: block;
}

h2 {
  margin-top: 8px;
  color: #e58bad;
}

.search-box {
  background: white;
  padding: 16px;
  border-radius: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  margin-bottom: 18px;
}

.search-box input,
.search-box select,
.form-box input,
.form-box select {
  width: 100%;
  padding: 11px;
  margin-bottom: 10px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: white;
  font-size: 15px;
}

.search-title {
  font-weight: bold;
  margin-bottom: 10px;
  color: #d9799d;
}

button {
  border: none;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  cursor: pointer;
}

.main-button {
  width: 100%;
  background: #ff9fc5;
  color: white;
  font-weight: bold;
  padding: 14px;
  font-size: 16px;
  margin-bottom: 12px;
}

.back-button {
  background: #ddd;
  color: #666;
  margin-bottom: 15px;
}

.add-button {
  background: #ff9fc5;
  color: white;
  width: 100%;
  font-weight: bold;
  margin-bottom: 15px;
}

.card-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 10px;
  box-shadow: 0 2px 7px rgba(0,0,0,0.08);
  transition: 0.2s;
}

.card.not-owned {
  background: #eeeeee;
  filter: grayscale(1);
  opacity: 0.6;
}

.card-image {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  border-radius: 10px;
  background: #f1f1f1;
  display: block;
  margin-bottom: 8px;
}

.no-image {
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: 10px;
  background: #eee;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  margin-bottom: 8px;
  font-size: 13px;
}

.card-name {
  font-weight: bold;
  color: #555;
  margin-bottom: 5px;
}

.card-info {
  font-size: 12px;
  color: #888;
  line-height: 1.6;
}

.quantity {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 10px;
}

.quantity button {
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 50%;
  background: #ffb7d5;
  color: white;
  font-size: 20px;
}

.quantity-number {
  font-weight: bold;
  min-width: 25px;
  text-align: center;
}

.form-box {
  background: white;
  padding: 16px;
  border-radius: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.form-box label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 5px;
  color: #777;
}

.preview {
  width: 150px;
  max-width: 100%;
  border-radius: 10px;
  margin: 5px auto 15px;
  display: none;
}

.empty {
  text-align: center;
  color: #aaa;
  padding: 30px 10px;
}

.count {
  font-size: 13px;
  color: #999;
  margin-bottom: 10px;
}

@media (min-width: 600px) {
  .card-list {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>

<body>

<header>
  💗 アイカツ！カード管理 💗
</header>

<!-- ========================= -->
<!-- 検索画面 -->
<!-- ========================= -->

<div id="searchScreen" class="screen active">

  <div class="search-box">

    <div class="search-title">🔎 カード検索</div>

    <input
      type="text"
      id="searchName"
      placeholder="カード名を検索"
      oninput="displayCards()"
    >

    <!-- 弾 -->
    <select id="searchSeries" onchange="displayCards()">
      <option value="">弾：すべて</option>
      <option value="第1弾">第1弾</option>
    </select>

    <!-- 通常・プロモ -->
    <select id="searchKind" onchange="displayCards()">
      <option value="">通常orプロモ：すべて</option>
      <option value="通常">通常</option>
      <option value="プロモ">プロモ</option>
    </select>

    <!-- レア度 -->
    <select id="searchRarity" onchange="displayCards()">
      <option value="">レア度：すべて</option>
      <option value="ER">ER</option>
      <option value="PR">PR</option>
      <option value="R">R</option>
      <option value="N">N</option>
    </select>

    <!-- タイプ -->
    <select id="searchType" onchange="displayCards()">
      <option value="">タイプ：すべて</option>
      <option value="キュート">キュート</option>
      <option value="クール">クール</option>
      <option value="セクシー">セクシー</option>
      <option value="ポップ">ポップ</option>
    </select>

    <!-- ブランド -->
    <select id="searchBrand" onchange="displayCards()">
      <option value="">ブランド：すべて</option>
      <option value="Dreamy Crowm">Dreamy Crowm</option>
      <option value="Maple Ribbon">Maple Ribbon</option>
      <option value="Angery Sugar">Angery Sugar</option>
      <option value="FUTURING GIRL">FUTURING GIRL</option>
      <option value="SPICY AGEHA">SPICY AGEHA</option>
      <option value="その他">その他</option>
    </select>

  </div>

  <button class="main-button" onclick="showScreen('listScreen')">
    🃏 カード一覧を見る
  </button>

</div>


<!-- ========================= -->
<!-- カード一覧画面 -->
<!-- ========================= -->

<div id="listScreen" class="screen">

  <button class="back-button" onclick="showScreen('searchScreen')">
    ← 検索に戻る
  </button>

  <h2>🃏 カード一覧</h2>

  <button class="add-button" onclick="showScreen('addScreen')">
    ＋ カードを追加する
  </button>

  <div id="cardCount" class="count"></div>

  <div id="cardList" class="card-list"></div>

</div>


<!-- ========================= -->
<!-- カード追加画面 -->
<!-- ========================= -->

<div id="addScreen" class="screen">

  <button class="back-button" onclick="showScreen('listScreen')">
    ← カード一覧に戻る
  </button>

  <h2>＋ カードを追加</h2>

  <div class="form-box">

    <label>カード画像</label>

    <input
      type="file"
      id="cardImage"
      accept="image/*"
      onchange="previewImage()"
    >

    <img id="imagePreview" class="preview">

    <label>カード名</label>
    <input
      type="text"
      id="cardName"
      placeholder="カード名を入力"
    >

    <label>弾</label>
    <select id="cardSeries">
      <option value="第1弾">第1弾</option>
    </select>

    <label>通常 or プロモ</label>
    <select id="cardKind">
      <option value="通常">通常</option>
      <option value="プロモ">プロモ</option>
    </select>

    <label>レア度</label>
    <select id="cardRarity">
      <option value="ER">ER</option>
      <option value="PR">PR</option>
      <option value="R">R</option>
      <option value="N">N</option>
    </select>

    <label>タイプ</label>
    <select id="cardType">
      <option value="キュート">キュート</option>
      <option value="クール">クール</option>
      <option value="セクシー">セクシー</option>
      <option value="ポップ">ポップ</option>
    </select>

    <label>ブランド</label>
    <select id="cardBrand">
      <option value="Dreamy Crowm">Dreamy Crowm</option>
      <option value="Maple Ribbon">Maple Ribbon</option>
      <option value="Angery Sugar">Angery Sugar</option>
      <option value="FUTURING GIRL">FUTURING GIRL</option>
      <option value="SPICY AGEHA">SPICY AGEHA</option>
      <option value="その他">その他</option>
    </select>

    <button class="main-button" onclick="addCard()">
      💗 カードを登録する
    </button>

  </div>

</div>


<script>

let cards = JSON.parse(localStorage.getItem("aikatsuCards")) || [];

let selectedImage = "";


// =========================
// 画面切り替え
// =========================

function showScreen(screenId) {

  document.querySelectorAll(".screen").forEach(screen => {
    screen.classList.remove("active");
  });

  document.getElementById(screenId).classList.add("active");

  if (screenId === "listScreen") {
    displayCards();
  }

}


// =========================
// 画像プレビュー
// =========================

function previewImage() {

  const file = document.getElementById("cardImage").files[0];

  if (!file) {
    selectedImage = "";
    document.getElementById("imagePreview").style.display = "none";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {

    selectedImage = e.target.result;

    const preview = document.getElementById("imagePreview");

    preview.src = selectedImage;
    preview.style.display = "block";

  };

  reader.readAsDataURL(file);

}


// =========================
// カード追加
// =========================

function addCard() {

  const name = document.getElementById("cardName").value.trim();

  if (!name) {
    alert("カード名を入力してください！");
    return;
  }

  const card = {

    id: Date.now(),

    name: name,

    series: document.getElementById("cardSeries").value,

    kind: document.getElementById("cardKind").value,

    rarity: document.getElementById("cardRarity").value,

    type: document.getElementById("cardType").value,

    brand: document.getElementById("cardBrand").value,

    image: selectedImage,

    quantity: 0

  };

  cards.push(card);

  saveCards();

  alert("カードを登録しました！💗");

  resetForm();

  showScreen("listScreen");

}


// =========================
// 保存
// =========================

function saveCards() {

  localStorage.setItem(
    "aikatsuCards",
    JSON.stringify(cards)
  );

}

// カード表示
// =========================
